<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>OpenReader</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8f8f6; --fg: #1c1c1a; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #ececea; --muted: #9a9a94; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    /* The window has no system title bar: keep a strip to drag it by. */
    .drag { position: fixed; inset: 0 0 auto 0; height: 40px; -webkit-app-region: drag; }
    .box { text-align: center; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); }
    .bar { width: 160px; height: 3px; margin: 18px auto 0; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--muted) 25%, transparent); }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--muted); animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }
  </style>
</head>
<body>
  <div class="drag"></div>
  <div class="box">
    <h1>OpenReader</h1>
    <p>Starting…</p>
    <div class="bar"></div>
  </div>
</body>
</html>
