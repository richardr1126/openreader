name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e-testing:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      USE_EMBEDDED_WEED_MINI: true
      BASE_URL: http://127.0.0.1:3003
      AUTH_SECRET: ci-auth-secret-change-me-not-for-production
      TTS_PLAYBACK_TOKEN_SECRET: ci-tts-playback-token-secret-not-for-production
      USE_ANONYMOUS_AUTH_SESSIONS: true
      S3_INTERNAL_ENDPOINT: http://127.0.0.1:8333
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Restore PDF layout model
        uses: actions/cache@v6
        with:
          path: |
            docstore/model/PP-DocLayoutV3.onnx
            docstore/model/PP-DocLayoutV3.onnx.data
            docstore/model/pp-doclayoutv3.config.json
            docstore/model/pp-doclayoutv3.preprocessor_config.json
            docstore/model/pp-doclayoutv3.LICENSE.txt
          key: pdf-layout-model-${{ runner.os }}-${{ hashFiles('packages/compute-worker/src/inference/pdf/assets/manifest.json') }}
      - name: Install system dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y libreoffice-writer-nogui
          soffice --version
      - name: Install SeaweedFS weed binary
        run: |
          WEED_PATH=$(docker run --rm --entrypoint sh chrislusf/seaweedfs:4.18 -lc 'command -v weed')
          CID=$(docker create chrislusf/seaweedfs:4.18)
          docker cp "${CID}:${WEED_PATH}" ./weed
          docker rm "${CID}"
          sudo install -m 0755 ./weed /usr/local/bin/weed
          rm -f ./weed
          weed version
      - name: Install NATS server binary
        run: |
          curl -fsSL -o /tmp/nats-server.tar.gz \
            https://github.com/nats-io/nats-server/releases/download/v2.12.1/nats-server-v2.12.1-linux-amd64.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install -m 0755 /tmp/nats-server-v2.12.1-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare PDF layout model
        run: pnpm --filter @openreader/compute-worker model:ensure-pdf
      - name: Build app and enforce bundle guard
        run: |
          pnpm build
          pnpm build:bundle-guard
      - name: Install Playwright Browsers
        run: |
          # firefox is temporarily disabled because Playwright Firefox hangs on macOS 27.
          pnpm exec playwright install --with-deps chromium webkit
          # pnpm exec playwright install --with-deps firefox
      - name: Run deterministic Playwright tests
        run: pnpm test:e2e --max-failures=5 --reporter=list,github,html
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            tests/results/
          if-no-files-found: error
          retention-days: 30
