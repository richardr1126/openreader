name: Vitest Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  vitest-testing:
    name: vitest-testing (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the code the desktop app ships there (v5/DESKTOP_SHELL.md).
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest suites
        run: pnpm test:unit
      - name: Verify compute worker contract and boundary
        if: runner.os == 'Linux'
        run: pnpm compute:openapi:check && pnpm check:compute-boundary && pnpm check:install-profile
