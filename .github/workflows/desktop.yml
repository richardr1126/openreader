name: Desktop
# Stages, smoke-tests and packages the desktop app on each platform it ships for
# (v5/DESKTOP_SHELL.md). Pull requests build unsigned. A published release (or a
# manual run naming its tag) signs and notarizes the macOS app with the Release
# environment's credentials and attaches every installer to that release. A
# manual run with `sign` checks those credentials without touching a release.
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - 'packages/bootstrap/**'
      - '.github/workflows/desktop.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build, sign and attach installers to (blank builds unsigned)
        required: false
        default: ''
      sign:
        description: Sign and notarize the macOS app without attaching it to a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  SIGN_MAC: ${{ (github.event.release.tag_name || inputs.release_tag || inputs.sign) && 'true' || '' }}

jobs:
  package:
    name: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    environment: ${{ (github.event.release.tag_name || inputs.release_tag || inputs.sign) && 'Release' || '' }}
    env:
      # The build bakes nothing from these; next build only needs them present.
      AUTH_SECRET: build-placeholder-secret-value-32chars!!
      BASE_URL: http://localhost:3003
      NEXT_TELEMETRY_DISABLED: 1
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
          persist-credentials: false
      - name: Check release version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $version"
            exit 1
          fi
      # The staged runtime bundles the Node.js that runs staging.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install fpm
        # electron-builder's bundled fpm (for the .deb) is x64-only.
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - name: Skip ffmpeg-static
        # It has no Windows arm64 binary, so its install script fails there. The
        # desktop stages its own ffmpeg (packaging/ffmpeg) and never uses it.
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          sed -i 's/^  ffmpeg-static: true$/  ffmpeg-static: false/' pnpm-workspace.yaml
          grep -q '^  ffmpeg-static: false$' pnpm-workspace.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile
      - name: Stage runtime
        run: pnpm --dir desktop stage
      - name: Smoke test
        run: pnpm --dir desktop smoke
      - name: Package
        if: env.SIGN_MAC == '' || runner.os != 'macOS'
        run: pnpm --dir desktop package
      - name: Package, sign and notarize
        if: env.SIGN_MAC != '' && runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY"
          grep -q 'BEGIN PRIVATE KEY' "$APPLE_API_KEY" || { echo "::error::APPLE_API_KEY_P8 is not a base64 .p8 key"; exit 1; }
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          pnpm --dir desktop package
          # electron-builder stops on a failed notarization or staple; this checks
          # Gatekeeper's verdict on the result without another ticket lookup.
          app=$(echo desktop/dist/mac*/OpenReader.app)
          spctl --assess --type execute -vv "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: openreader-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to release
    needs: package
    if: github.event.release.tag_name || inputs.release_tag
    runs-on: ubuntu-24.04
    environment: Release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: openreader-desktop-*
          path: installers
          merge-multiple: true
      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"
